# .github/workflows/release.yml
#
# Triggered when a version tag is pushed.
#
# Tag convention:
#   v0.4.0a1   → alpha pre-release    → Test PyPI
#   v0.4.0b1   → beta pre-release     → Test PyPI
#   v0.4.0rc1  → release candidate    → Test PyPI
#   v0.4.0     → final release        → production PyPI
#
# Pipeline:
#   1. Run full CI (lint, format check, type check, tests) to verify the tag is clean
#   2. Extract the release notes for this version from CHANGELOG.md
#   3. Build the Python distribution (sdist + wheel)
#   4. Create a GitHub Release with the extracted notes and built artifacts
#   5. Publish to Test PyPI (pre-release) or production PyPI (final)
#
# Adapted from ha_mqtt_sdk's release.yml — differences from that version:
#   - No src/ layout: this project's package lives at dirigera_bridge/,
#     not src/dirigera_bridge/, so mypy/coverage targets point there directly.
#   - The verify job spins up a live Mosquitto broker service, matching
#     ci.yml — this project's test suite includes integration tests
#     (tests/integration/) that need a real broker, unlike ha_mqtt_sdk's
#     fully-mocked suite.
#   - Added a "docker" job: publishes ghcr.io/<owner>/<repo> (multi-arch:
#     amd64 + arm64, covering both a dev laptop and a Raspberry Pi
#     deployment) on every tag. This runs entirely on GitHub's hosted
#     runner using the automatic GITHUB_TOKEN — no Docker Hub account,
#     no extra secret, and nothing required on your local machine.
#
# First-time GHCR gotcha:
#   A package published under a *personal* GitHub account (not an
#   organization) defaults to PRIVATE the first time it's pushed, even if
#   the repository itself is public — GitHub doesn't auto-inherit
#   visibility, only access permissions. After your first tag push,
#   go to your GitHub profile → Packages → dirigera-bridge → Package
#   settings → Change visibility → Public, or it won't be pullable by
#   anyone but you.
#
# Before the first PyPI tag push:
#   Publishing to production PyPI makes the source publicly downloadable.
#   This project intended to be open source (MIT, see LICENSE), so
#   that's expected - just confirm README.md's License section reflects
#   that before pushing a non-prerelease tag. Pushing an alpha/beta/rc tag
#   only publishes to Test PyPI, which is lower-stakes if you want to dry-run
#   this pipeline first.
#
# Required repository secrets:
#   PYPI_API_TOKEN        — https://pypi.org/manage/account/token/
#   TEST_PYPI_API_TOKEN   — https://test.pypi.org/manage/account/token/
#   (GHCR needs no secret — it uses the automatic GITHUB_TOKEN)
#
# Required GitHub environments:
#   pypi       — for production releases
#   test-pypi  — for pre-releases
#
# How to trigger:
#   Pre-release:  git tag v1.0.0a1  && git push origin v1.0.0a1
#   Final:        git tag v1.0.0    && git push origin v1.0.0

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"          # final:             v0.1.0, v1.0.0
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"   # alpha:             v0.1.0a1
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"   # beta:              v0.1.0b1
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"  # release candidate: v0.1.0rc1

permissions:
  contents: write   # needed to create GitHub Release
  packages: write   # needed to push the Docker image to GHCR

jobs:

  # ── Determine release type ─────────────────────────────────────────────────

  prepare:
    name: Prepare
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
      pypi_env: ${{ steps.parse.outputs.pypi_env }}

    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # Detect pre-release suffix: a, b, or rc
          if [[ "$VERSION" =~ (a|b|rc)[0-9]$ ]]; then
            IS_PRERELEASE="true"
            PYPI_ENV="test-pypi"
          else
            IS_PRERELEASE="false"
            PYPI_ENV="pypi"
          fi

          echo "version=$VERSION"             >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "pypi_env=$PYPI_ENV"           >> $GITHUB_OUTPUT

          echo "Tag:           $TAG"
          echo "Version:       $VERSION"
          echo "Pre-release:   $IS_PRERELEASE"
          echo "Target:        $PYPI_ENV"

  # ── 1. Verify the tag is clean ─────────────────────────────────────────────

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: prepare

    services:
      mqtt:
        image: eclipse-mosquitto:2.0
        ports:
          - 1883:1883
        options: >-
          --health-cmd "nc -z localhost 1883 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${{ needs.prepare.outputs.version }}"
          TOML_VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          print(d['project']['version'])
          ")
          if [ "$TAG_VERSION" != "$TOML_VERSION" ]; then
            echo "ERROR: Tag $TAG_VERSION does not match pyproject.toml version $TOML_VERSION"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format . --check --diff

      - name: Type check
        run: mypy dirigera_bridge

      - name: Run tests
        run: |
          pytest \
            --cov=dirigera_bridge \
            --cov-report=term-missing \
            --cov-fail-under=100 \
            -v

  # ── 2. Extract release notes from CHANGELOG.md ────────────────────────────

  changelog:
    name: Extract changelog
    runs-on: ubuntu-latest
    needs: [prepare, verify]

    outputs:
      release_notes: ${{ steps.extract.outputs.release_notes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract release notes
        id: extract
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          # Extract the block between ## [VERSION] and the next ## [
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "ERROR: No changelog entry found for version $VERSION"
            echo "Make sure CHANGELOG.md contains a ## [$VERSION] section"
            exit 1
          fi

          # Write to file to preserve multiline content
          echo "$NOTES" > release_notes.txt
          echo "Release notes extracted for version $VERSION"

          # Pass to output using GitHub multiline delimiter
          {
            echo "release_notes<<RELEASE_NOTES_EOF"
            cat release_notes.txt
            echo "RELEASE_NOTES_EOF"
          } >> $GITHUB_OUTPUT

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release_notes.txt

  # ── 3. Build distribution ─────────────────────────────────────────────────

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution contents
        run: twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # ── 4. Build and push Docker image to GHCR ──────────────────────────────────────────────

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: [prepare, verify]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute image name and tags
        id: meta
        run: |
          # GHCR requires an all-lowercase image name; github.repository
          # keeps whatever case the repo name has (Dirigera-Bridge), so
          # this lowercases it rather than hardcoding it.
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ needs.prepare.outputs.version }}"

          TAGS="$IMAGE:$VERSION"
          if [ "${{ needs.prepare.outputs.is_prerelease }}" = "false" ]; then
            TAGS="$TAGS
          $IMAGE:latest"
          fi

          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          {
            echo "tags<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          # This label is what lets the published package auto-link to
          # this repo (see the GHCR visibility note in the header comment).

  # ── 5. Create GitHub Release ──────────────────────────────────────────────

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, changelog, build]

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ needs.prepare.outputs.version }}"
          body: ${{ needs.changelog.outputs.release_notes }}
          files: dist/*
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}

  # ── 5. Publish to PyPI ────────────────────────────────────────────────────

  publish:
    name: Publish to ${{ needs.prepare.outputs.pypi_env }}
    runs-on: ubuntu-latest
    needs: [prepare, release]

    permissions:
      id-token: write

    environment:
      name: ${{ needs.prepare.outputs.pypi_env }}
      url: ${{ needs.prepare.outputs.pypi_env == 'test-pypi' && 'https://test.pypi.org/project/dirigera_bridge/' || 'https://pypi.org/project/dirigera_bridge/' }}

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        if: needs.prepare.outputs.is_prerelease == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Publish to production PyPI
        if: needs.prepare.outputs.is_prerelease == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
